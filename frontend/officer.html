<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f1947">
  <title>Awaaz – अधिकारी डैशबोर्ड</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M8 6h32a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H22l-9 8v-8H8a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z' fill='%23f0612e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <section id="loginCard" class="card login" hidden>
      <span class="eyebrow">अधिकारी</span>
      <h2>लॉगिन करें</h2>
      <form id="loginForm">
        <label for="user">यूज़रनेम</label>
        <input id="user" type="text" autocomplete="username" required>
        <label for="pass">पासवर्ड</label>
        <input id="pass" type="password" autocomplete="current-password" required>
        <button class="send" type="submit">लॉगिन</button>
        <p id="loginStatus" class="status"></p>
      </form>
    </section>

    <div id="dash" hidden>
      <section class="card hero">
        <span class="eyebrow" id="deptName"></span>
        <h1 id="greeting">नमस्ते</h1>
        <p>सबसे खतरनाक समस्याएँ ऊपर हैं, फिर वे जिन्हें ज़्यादा लोगों ने बताया। हर शिकायत के साथ AI की जाँच और तैयार पत्र है।</p>
      </section>

      <section class="tiles" id="stats" style="margin-top:18px"></section>

      <div class="dash-grid" style="margin-top:18px">
        <section class="card">
          <h2>शिकायतों की स्थिति <small class="hint" id="days"></small></h2>
          <div class="donut-wrap" id="donut"></div>
        </section>
        <section class="card">
          <h2>🔥 हॉटस्पॉट</h2>
          <p class="hint" style="margin:-6px 0 12px">जहाँ से बार-बार शिकायत आ रही है</p>
          <div id="areas" class="areas"></div>
        </section>
      </div>

      <section style="margin-top:22px">
        <div class="queue-head">
          <h2>काम की सूची <small id="queueCount"></small></h2>
          <span class="status" id="refreshed"></span>
        </div>
        <div class="filters" id="filters">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">सभी</button>
          <button class="chip" type="button" data-filter="critical" aria-pressed="false">🔴 बहुत ज़रूरी</button>
          <button class="chip" type="button" data-filter="high" aria-pressed="false">🟠 ज़रूरी</button>
          <button class="chip" type="button" data-filter="in_progress" aria-pressed="false">काम चालू</button>
          <button class="chip" type="button" data-filter="needs_review" aria-pressed="false">जाँच बाकी</button>
          <input id="search" type="text" placeholder="🔍 जगह या समस्या खोजें" aria-label="खोजें">
        </div>
        <div id="queue" class="queue"></div>
      </section>
    </div>
  </main>
  <script type="module" src="officer.js"></script>
</body>
</html>
