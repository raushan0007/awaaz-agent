<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awaaz – शिकायत का हाल</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23d9480f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">आवाज़ <span>Awaaz</span></a>
    <p class="tag">अपनी शिकायत का हाल देखें</p>
  </header>
  <main>
    <section class="card">
      <form id="lookup" class="lookup">
        <label for="cid">शिकायत संख्या</label>
        <div class="row">
          <input id="cid" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="जैसे: 12">
          <button class="send small" type="submit">देखें</button>
        </div>
      </form>
      <p id="status" class="status"></p>
    </section>
    <section id="result" class="card" hidden></section>
  </main>
  <script type="module" src="track.js"></script>
</body>
</html>
