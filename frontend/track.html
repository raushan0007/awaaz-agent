<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1546">
  <title>Awaaz – शिकायत का हाल</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3CclipPath id='t'%3E%3Crect width='48' height='48' rx='12'/%3E%3C/clipPath%3E%3Cg clip-path='url%28%23t%29'%3E%3Crect width='48' height='16' fill='%23ff9933'/%3E%3Crect y='16' width='48' height='16' fill='%23fff'/%3E%3Crect y='32' width='48' height='16' fill='%23138808'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='7' fill='none' stroke='%230a2a8a' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="card hero">
      <span class="eyebrow">शिकायत का हाल</span>
      <h1>आपकी शिकायत कहाँ तक पहुँची?</h1>
      <p>शिकायत संख्या डालिए। विभाग जो भी करेगा, उसकी जानकारी यहाँ सरल हिंदी में मिलेगी।</p>
    </section>
    <section class="card">
      <form id="lookup">
        <label for="cid">शिकायत संख्या</label>
        <div class="row">
          <input id="cid" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="जैसे: 12">
          <button class="send small" type="submit">देखें</button>
        </div>
      </form>
      <p id="status" class="status"></p>
    </section>
    <section id="result" class="card ticket" hidden></section>
  </main>
  <script type="module" src="track.js"></script>
</body>
</html>
